name: checks
# Проверочный CI по Сервис-стандарту (W4): hadolint, compose-валидация, тесты, trivy-отчёт.
# Репо публичный: в workflow никаких адресов/секретов; compose проверяется молча (-q).
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile lint (hadolint, информационно)
        run: if [ -f Dockerfile ]; then docker run --rm -i hadolint/hadolint < Dockerfile || true; fi
      - name: compose валидна (без печати секретов)
        run: |
          f=docker-compose.yml; [ -f "$f" ] || exit 0
          if [ -f .env.example ]; then cp .env.example .env; else
            grep -oE '\$\{[A-Za-z_]+[:-]' "$f" | sed 's/[${:-]//g' | sort -u | while read v; do echo "$v=checkdummy" >> .env; done
          fi
          [ -f .env ] || touch .env
          docker compose -f "$f" config -q && echo "compose OK"
      - name: Тесты
        run: npm ci && npm test
      - name: trivy скан зависимостей (отчёт CRITICAL и HIGH)
        # v0.28.0 сломан upstream (ссылается на несуществующий setup-trivy@v0.2.1), рабочая — v0.36.0
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 0
          format: json
          output: trivy-report.json
      - name: trivy гейт (CRITICAL делает проверку красной, HIGH остаётся в отчёте)
        # Сервис-стандарт, п.17: деплой без зелёной проверки этого коммита не выполняется
        # (гейт в deploy.yml), поэтому красная проверка здесь означает заблокированный деплой.
        run: |
          python3 - <<'PY'
          import json, sys

          # Разбор отчёта trivy (JSON). Код выхода 1, только если есть CRITICAL.
          # HIGH остаются в отчёте и не блокируют: иначе проверка краснеет из-за шума.
          data = json.load(open("trivy-report.json"))
          crit, high = [], []
          for result in data.get("Results") or []:
              target = result.get("Target", "")
              for v in result.get("Vulnerabilities") or []:
                  row = (target, v.get("PkgName"), v.get("InstalledVersion"), v.get("VulnerabilityID"), v.get("FixedVersion") or "нет фикса")
                  (crit if v.get("Severity") == "CRITICAL" else high).append(row)

          def show(title, rows):
              if not rows:
                  return
              print(f"\n{title}: {len(rows)}")
              for t, p, ver, cve, fix in sorted(set(rows)):
                  print(f"  {t} | {p} {ver} | {cve} | фикс: {fix}")

          show("CRITICAL", crit)
          show("HIGH", high)
          print(f"\ntrivy: CRITICAL {len(crit)}, HIGH {len(high)}")
          if crit:
              sys.exit("Найдены CRITICAL уязвимости. Проверка красная, деплой этого коммита заблокирован (Сервис-стандарт, п.17).")
          PY
