name: deploy
# Деплой stream-bot на skrime-main: юзер deploy, отдельный ключ (не root).
# Репо публичный: адрес сервера только через секреты — SKRIME_DEPLOY_HOST,
# ключ SKRIME_DEPLOY_KEY, хост-ключ SKRIME_HOST_KEY. В коде адресов нет.
on: [workflow_dispatch]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-stream-bot
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: "Гейт: деплой только при зелёной проверке checks на этом коммите"
        # Сервис-стандарт, п.15: деплой уходит ровно того коммита, что прошёл проверки.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          STATE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow checks.yml --commit "$GITHUB_SHA" --json status,conclusion \
            --jq 'if length == 0 then "нет запуска" else (sort_by(.createdAt) | last | (.status + "/" + (.conclusion // "в работе"))) end')"
          echo "checks.yml на $GITHUB_SHA: $STATE"
          if [ "$STATE" != "completed/success" ]; then
            echo "::error::Проверка checks.yml на этом коммите в состоянии «$STATE», а не «успех». Деплой отменён."
            exit 1
          fi
      - name: Настроить SSH (deploy@skrime-main)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SKRIME_DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SKRIME_HOST_KEY }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host skrime-main
              HostName ${{ secrets.SKRIME_DEPLOY_HOST }}
              User deploy
              IdentityFile ~/.ssh/id_deploy
              IdentitiesOnly yes
          CFG
      - name: Деплой (снапшот, hotfix-детект, заливка, build, verify)
        run: bash deploy.sh
      - name: Пост-проверка
        run: |
          ssh skrime-main 'docker ps --filter name=stream-bot --format "{{.Status}}"'
