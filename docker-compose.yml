services:
  stream-bot:
    build: .
    container_name: stream-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Монтируется КОРЕНЬ git-репо заметок (там, где .git).
      # Бот пишет в wiki/stream.md внутри него и пушит обратно.
      - ./notes:/app/wiki
    environment:
      - WIKI_PATH=/app/wiki
